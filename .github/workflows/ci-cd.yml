name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: Backend/pom.xml
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validar JavaScript
        run: |
          while IFS= read -r -d '' file; do
            node --check "$file"
          done < <(find Frontend/js -name '*.js' -print0)
      - name: Compilar e executar testes
        working-directory: Backend
        run: bash ./mvnw --batch-mode --no-transfer-progress clean verify
      - name: Guardar resultados dos testes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: testes
          path: Backend/target/surefire-reports/
          if-no-files-found: warn
      - name: Construir imagem de deployment
        run: docker build --build-arg RENDER_GIT_COMMIT="$GITHUB_SHA" -t app:ci .
      - name: Verificar container
        run: |
          docker run -d --name app-ci -p 10000:10000 app:ci
          trap 'docker logs app-ci; docker rm -f app-ci' EXIT
          for attempt in {1..60}; do
            if curl -fsS http://localhost:10000/version.txt | grep -Fx "$GITHUB_SHA"; then
              curl -fsS http://localhost:10000/ > /dev/null
              curl -fsS http://localhost:10000/funcionarios | python3 -c 'import json,sys; assert isinstance(json.load(sys.stdin), list)'
              exit 0
            fi
            sleep 2
          done
          exit 1

  deploy:
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    concurrency:
      group: render-production
      cancel-in-progress: false
    env:
      DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
      APP_URL: ${{ vars.RENDER_APP_URL }}
    steps:
      - name: Validar configuracao
        run: |
          test -n "$DEPLOY_HOOK" || { echo 'Configure o secret RENDER_DEPLOY_HOOK_URL'; exit 1; }
          test -n "$APP_URL" || { echo 'Configure a variable RENDER_APP_URL'; exit 1; }
      - name: Publicar o commit aprovado no Render
        run: |
          curl --fail --silent --show-error --max-time 60 --output /dev/null --request POST --url-query "ref=$GITHUB_SHA" "$DEPLOY_HOOK"
      - name: Confirmar versao publicada e endpoints
        run: |
          for attempt in {1..90}; do
            version=$(curl -fsS --max-time 15 "${APP_URL%/}/version.txt" || true)
            if [ "$version" = "$GITHUB_SHA" ]; then
              curl -fsS --max-time 30 "${APP_URL%/}/" > /dev/null
              curl -fsS --max-time 30 "${APP_URL%/}/funcionarios" | python3 -c 'import json,sys; assert isinstance(json.load(sys.stdin), list)'
              echo "Deployment confirmado: $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep 10
          done
          echo 'O Render nao publicou o commit esperado dentro do prazo.'
          exit 1
